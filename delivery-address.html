<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spring | Delivery Address</title>

    <link href="https://fonts.googleapis.com/css2?family=Vidaloka&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

    <style>
        :root {
            --cream: #F3F1E8;
            --green: #3B5849;
            --green-dark: #2E4639;
            --sand: #E5DEC9;
            --ink: #1B1B18;
            --muted: #5A5C55;
            --line: #B8B6AC;
            --font-vidaloka: 'Vidaloka', Georgia, serif;
            --font-clarity: 'Clarity City', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            font-family: var(--font-clarity);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main { flex: 1; }

        .vidaloka { font-family: var(--font-vidaloka); font-weight: 400; }

        /* Header & Footer */
        .site-header { border-bottom: 1px solid var(--green); padding: 14px 0; }
        .site-footer { padding-bottom: 32px; }
        .footer-inner { border-top: 1px solid var(--line); padding-top: 24px; }

        .navbar-brand, .footer-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: #0F110E;
            text-decoration: none;
            font-size: 28px;
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--green);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .brand-badge img { width: 24px; height: 24px; object-fit: contain; }

        .navbar-nav { gap: 36px; }
        .navbar-nav .nav-link { color: var(--ink); font-size: 16px; padding: 4px 0; }
        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active { border-bottom: 2px solid var(--green); color: var(--ink); }

        /* Delivery Form */
        .delivery-section { padding: 56px 0 36px; }
        .delivery-section h1 { color: var(--green); font-size: 36px; margin-bottom: 24px; }

        .pill-input {
            border-radius: 999px;
            height: 44px;
            padding: 10px 22px;
            font-size: 13px;
            box-shadow: none !important;
        }

        .pill-input::placeholder {
            color: var(--muted);
            font-weight: 600;
            font-size: 11.5px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .pill-filled { background: var(--sand); border: 1px solid transparent; }
        .pill-filled:focus { background: #DDD4BA; border-color: var(--green); }

        .pill-outlined { background: #FAF9F4; border: 1px solid var(--green); }
        .pill-outlined:focus { background: #FFFFFF; border-color: var(--green-dark); }

        /* Order Summary */
        .summary-card { background: var(--green); color: #FFFFFF; padding: 30px 26px 34px; }
        .summary-card h2 { font-size: 24px; margin-bottom: 22px; }

        .summary-item { display: flex; gap: 14px; margin-bottom: 18px; }
        .summary-thumb {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            background: #FFFFFF;
            overflow: hidden;
            flex-shrink: 0;
        }
        .summary-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .summary-item h3 { font-family: var(--font-clarity); font-size: 14px; font-weight: 600; margin: 2px 0; }
        .summary-meta { font-size: 12px; color: #C9D3CD; margin: 0 0 4px; }
        .summary-price { font-size: 13px; font-weight: 600; margin: 0; }

        .summary-divider { border: 0; border-top: 1px solid rgba(255, 255, 255, 0.25); margin: 20px 0 16px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.05em; color: #DCE3DF; margin-bottom: 10px; }
        .summary-total { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-top: 16px; }

        /* Buttons */
        .delivery-actions { margin-top: 48px; }

        .btn-back {
            border: 1.25px solid var(--green);
            color: var(--green);
            border-radius: 999px;
            padding: 10px 28px;
            background: transparent;
        }
        .btn-back:hover { background: var(--green); color: #FFFFFF; }

        .btn-checkout {
            background: var(--green) !important;
            color: #FFFFFF !important;
            border: none !important;
            border-radius: 999px !important;
            padding: 10px 28px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-checkout:hover { background: var(--green-dark) !important; }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand vidaloka" href="index.html">
                    <span class="brand-badge">
                        <img src="https://lh3.google.com/u/0/d/1lnb3jkcjCi26Rn4YnPD8-cxhAH5YWP-n=w1912-h914-iv2?auditContext=prefetch" alt="Spring logo">
                    </span>
                    <span>Spring</span>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                    aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavigation">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="shop.html">Shop</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="delivery-section">
            <div class="container">
                <div class="row g-5 align-items-start justify-content-between">

                    <div class="col-lg-7">
                        <h1 class="vidaloka">Delivery Address</h1>

                        <form id="delivery-address-form" data-delivery-form action="order-form.html" method="post">
                            <div class="mb-3">
                                <label for="country" class="visually-hidden">Country / Region</label>
                                <input type="text" class="form-control pill-input pill-filled" id="country" name="country"
                                    placeholder="COUNTRY / REGION" autocomplete="country-name" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="visually-hidden">First Name</label>
                                    <input type="text" class="form-control pill-input pill-filled" id="firstName" name="firstName"
                                        placeholder="FIRST NAME" autocomplete="given-name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="visually-hidden">Last Name</label>
                                    <input type="text" class="form-control pill-input pill-filled" id="lastName" name="lastName"
                                        placeholder="LAST NAME" autocomplete="family-name" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="visually-hidden">Address</label>
                                <input type="text" class="form-control pill-input pill-outlined" id="address" name="address"
                                    placeholder="ADDRESS" autocomplete="street-address" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="postalCode" class="visually-hidden">Postal Code</label>
                                    <input type="text" class="form-control pill-input pill-outlined" id="postalCode" name="postalCode"
                                        placeholder="POSTAL CODE" autocomplete="postal-code" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="city" class="visually-hidden">City</label>
                                    <input type="text" class="form-control pill-input pill-outlined" id="city" name="city"
                                        placeholder="CITY" autocomplete="address-level2" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="visually-hidden">Phone</label>
                                <input type="tel" class="form-control pill-input pill-outlined" id="phone" name="phone"
                                    placeholder="PHONE" autocomplete="tel" required>
                            </div>

                            <p data-delivery-feedback aria-live="polite" class="text-success small mt-2 mb-0"></p>
                        </form>
                    </div>

                    <div class="col-lg-4">
                        <aside class="summary-card" aria-label="Order Summary">
                            <h2 class="vidaloka">Order Summary</h2>

                            <div class="summary-item">
                                <div class="summary-thumb">
                                    <img src="https://drive.google.com/file/d/1SF41zBOrdxpwMnp7FzstHmmCUw4BGSIr/view?usp=sharing" alt="Do Good Work Tee">
                                </div>
                                <div>
                                    <h3>Do Good Work Tee</h3>
                                    <p class="summary-meta">XS · Qty 1</p>
                                    <p class="summary-price">₱499</p>
                                </div>
                            </div>

                            <div class="summary-item">
                                <div class="summary-thumb">
                                    <img src="https://drive.google.com/file/d/140_43wzGAZV9l2M2qiIW0r22pGdKLWWZ/view?usp=sharing" alt="Everyday Comfort Tee">
                                </div>
                                <div>
                                    <h3>Everyday Comfort Tee</h3>
                                    <p class="summary-meta">M · Qty 1</p>
                                    <p class="summary-price">₱499</p>
                                </div>
                            </div>

                            <hr class="summary-divider">

                            <div class="summary-row">
                                <span>SUBTOTAL</span>
                                <span>₱998</span>
                            </div>
                            <div class="summary-row">
                                <span>DELIVERY FEE</span>
                                <span>FREE</span>
                            </div>
                            <div class="summary-total">
                                <span>TOTAL</span>
                                <span>₱998</span>
                            </div>
                        </aside>
                    </div>

                </div>

                <div class="delivery-actions d-flex justify-content-between align-items-center">
                    <a href="cart.html" class="btn btn-back">Go Back</a>
                    <button type="submit" form="delivery-address-form" class="btn product-button btn-checkout">
                        Check Out <span aria-hidden="true">&rarr;</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-inner">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <a href="index.html" class="footer-brand vidaloka">
                            <span class="brand-badge">
                                <img src="https://lh3.google.com/u/0/d/1lnb3jkcjCi26Rn4YnPD8-cxhAH5YWP-n=w1912-h914-iv2?auditContext=prefetch" alt="">
                            </span>
                            <span>Spring</span>
                        </a>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <p class="mb-0">
                            © 2026 ·
                            <a href="privacy-policy.html" class="text-dark text-decoration-none">Privacy</a>
                            ·
                            <a href="terms.html" class="text-dark text-decoration-none">Terms</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
